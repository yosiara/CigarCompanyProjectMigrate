services:
  odoo:
    build: .
    container_name: odoo_${CONTAINER_NAME}
    depends_on:
      - postgres
    environment:
      - HOST=db_${CONTAINER_NAME}
      - USER=${CONTAINER_USER}
      - PASSWORD=${CONTAINER_PASSWORD}
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./extra-addons:/mnt/extra-addons
    command: --dev=all
    tty: true
    restart: unless-stopped

  postgres:
    image: postgres:17-bookworm
    container_name: db_${CONTAINER_NAME}
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${CONTAINER_USER}
      - POSTGRES_PASSWORD=${CONTAINER_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
#    ports:
#      - "5051:5432"
    volumes:
      - postgres-odoo-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  odoo-data:
    name: odoo-${VOLUMES_NAME}
  postgres-odoo-data:
    name: postgres-${VOLUMES_NAME}