; # Worker Formula: (CPU cores * 2) + 1
; ## Example for 4-core server: (4 * 2) + 1 = 9 workers
workers = 9

; # Cron worker (separate from HTTP workers)
max_cron_threads = 2

; # Memory Limits (in bytes)
; ## 5GB - worker killed above this, default=2.6844GB
limit_memory_hard = 5000000000
; ## 4GB - worker recycled above this, 80% limit memory hard, default=2.1475GB
limit_memory_soft = 4000000000

; # Request Limits
; ## Max requests before worker recycled
limit_request = 8192
; ## Max CPU seconds per request
limit_time_cpu = 600
; ## Max wall-clock seconds per request
limit_time_real = 1200

; # Longpolling (for live chat, notifications)
longpolling_port = 8072
